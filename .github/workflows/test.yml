name: test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.png']
  pull_request:
    paths-ignore: ['**.md', '**.png']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Slicer runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb \
            libx11-6 libx11-xcb1 libxau6 libxdmcp6 libxext6 libxrender1 libxi6 libsm6 libice6 \
            libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0 libxcb-glx0 libxkbcommon0 libxkbcommon-x11-0 \
            libgl1 libglx0 libglvnd0 libegl1 libopengl0 libglu1-mesa \
            libfontconfig1 libfreetype6 libharfbuzz0b libgraphite2-3 libpng16-16t64 libexpat1 \
            libdbus-1-3 libglib2.0-0t64 libdouble-conversion3 libpcre2-16-0 libmd4c0 libbrotli1 \
            libpulse0 libpulse-mainloop-glib0 libasound2t64 libnss3 \
            libatomic1 libarchive13t64 libzstd1 liblz4-1 liblzma5 libbz2-1.0 libopenjp2-7 \
            libkrb5-3 libgssapi-krb5-2

      - name: Cache Slicer
        id: cache-slicer
        uses: actions/cache@v4
        with:
          path: slicer
          key: slicer-linux-stable-${{ runner.os }}-v1

      - name: Download Slicer
        if: steps.cache-slicer.outputs.cache-hit != 'true'
        run: |
          mkdir -p slicer
          curl -sSL "https://download.slicer.org/download?os=linux&stability=release" -o slicer.tar.gz
          tar -xzf slicer.tar.gz -C slicer --strip-components=1
          rm slicer.tar.gz

      - name: Run module self-test
        run: Testing/run_headless_test.sh "$PWD/slicer/Slicer"

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Slicer
        run: |
          curl -sSL "https://download.slicer.org/download?os=macosx&stability=release" -o slicer.dmg
          hdiutil attach -nobrowse -mountpoint /Volumes/Slicer slicer.dmg
          cp -R /Volumes/Slicer/Slicer.app "$PWD/Slicer.app"
          hdiutil detach /Volumes/Slicer
          rm slicer.dmg

      - name: Run module self-test
        run: Testing/run_headless_test.sh "$PWD/Slicer.app/Contents/MacOS/Slicer"

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download and install Slicer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.slicer.org/download?os=win&stability=release" -OutFile slicer-installer.exe
          Start-Process -FilePath .\slicer-installer.exe -ArgumentList '/S', '/D=C:\Slicer' -Wait
          Get-ChildItem C:\Slicer | Select-Object -First 5

      - name: Run module self-test
        shell: bash
        run: Testing/run_headless_test.sh "C:/Slicer/Slicer.exe"
